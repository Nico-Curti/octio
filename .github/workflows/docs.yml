name: Documentation

on:
  push:
    paths:
      - "docs/**"
      - "include/**"
      - "python/**"
      - "README.md"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Install project and documentation dependencies
        run: python -m pip install ".[docs]"
      - name: Build Sphinx documentation
        run: sphinx-build -W --keep-going -b html docs/source docs/_build/html
      - name: Configure Doxygen
        run: >-
          cmake -S . -B build-docs
          -DOCTIO_BUILD_DOCS=ON
          -DOCTIO_BUILD_TESTS=OFF
          -DOCTIO_BUILD_TOOLS=OFF
      - name: Build Doxygen documentation
        run: cmake --build build-docs --target docs-cpp
