name: CI

on:
  push:
  pull_request:

jobs:
  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DOCTIO_BUILD_TESTS=ON
          -DOCTIO_BUILD_TOOLS=ON
          -DOCTIO_BUILD_EXAMPLES=ON
          -DOCTIO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test default local install prefix
        run: cmake --install build --config Release
      - name: Configure installed-package consumer
        run: >-
          cmake -S tests/consumer -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install"
      - name: Build installed-package consumer
        run: cmake --build consumer-build --config Release --parallel
      - name: Test configurable install prefix
        run: >-
          cmake --install build --config Release
          --prefix "${{ github.workspace }}/local-custom"

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package from source
        run: python -m pip install ".[test]"
      - name: Test installed package without development paths
        env:
          PYTHONPATH: ""
          OCTIO_LIBRARY: ""
        run: python -m pytest -q tests/test_installed.py
      - name: Verify native library is packaged beside Python sources
        env:
          PYTHONPATH: ""
          OCTIO_LIBRARY: ""
        run: >-
          python -c "from pathlib import Path; import octio; from octio import _native;
          root=Path(octio.__file__).resolve().parent;
          native=Path(_native.lib._name).resolve();
          assert native.parent == root, (native, root);
          print(native)"
      - name: Test installed console entry point
        env:
          PYTHONPATH: ""
          OCTIO_LIBRARY: ""
        run: octio --version

  python-editable:
    name: Python editable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package in editable mode
        run: python -m pip install -e ".[test]"
      - name: Test editable package without development overrides
        env:
          PYTHONPATH: ""
          OCTIO_LIBRARY: ""
        run: python -m pytest -q tests/test_installed.py
      - name: Verify editable native library resolution
        env:
          PYTHONPATH: ""
          OCTIO_LIBRARY: ""
        run: >-
          python -c "import octio; from octio import _native;
          print(octio.__file__); print(_native.lib._name)"
      - name: Test editable console entry point
        env:
          PYTHONPATH: ""
          OCTIO_LIBRARY: ""
        run: octio --version

  vcpkg:
    name: vcpkg / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: .vcpkg
      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure with vcpkg manifest mode
        run: >-
          cmake -S . -B build-vcpkg
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/.vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_MODE=ON
          -DOCTIO_BUILD_TESTS=ON
          -DOCTIO_BUILD_PYTHON_TESTS=OFF
      - name: Build vcpkg configuration
        run: cmake --build build-vcpkg --config Release --parallel
      - name: Test vcpkg configuration
        run: ctest --test-dir build-vcpkg -C Release --output-on-failure
      - name: Install overlay port (Unix)
        if: runner.os != 'Windows'
        run: >-
          ./.vcpkg/vcpkg install octio
          --classic
          --overlay-ports=ports
          --x-install-root="${{ runner.temp }}/octio-vcpkg"
      - name: Install overlay port (Windows)
        if: runner.os == 'Windows'
        run: >-
          .\.vcpkg\vcpkg.exe install octio
          --classic
          --overlay-ports=ports
          --x-install-root="${{ runner.temp }}\octio-vcpkg"
